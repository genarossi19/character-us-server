<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CharacterUs Test</title>
  </head>
  <body>
    <h1>Prueba CharacterUs</h1>

    <h2>Crear Sala</h2>
    <button id="createRoomBtn">Crear Sala</button>
    <p id="roomPin">PIN de la sala: -</p>

    <h2>Unirse a Sala</h2>
    <button id="joinRoomBtn">Unirse</button>

    <h2>Jugadores en la sala:</h2>
    <ul id="playersList"></ul>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      const socket = io("http://localhost:3000");
      const playersList = document.getElementById("playersList");
      const roomPinElement = document.getElementById("roomPin");

      function updatePlayersList(players, hostId, mySocketId) {
        playersList.innerHTML = "";
        players.forEach((p) => {
          let displayName = p.username;
          if (p.socketId === hostId) displayName += " (host)";
          if (p.socketId === mySocketId) displayName += " (tu)";
          const li = document.createElement("li");
          li.innerText = displayName;
          playersList.appendChild(li);
        });
      }

      // Crear sala
      document.getElementById("createRoomBtn").addEventListener("click", () => {
        const username = prompt("Ingresa tu nombre de jugador:");
        if (!username) return;

        socket.emit("createRoom", { username }, (res) => {
          roomPinElement.innerText = `PIN de la sala: ${res.gamePin}`;
          console.log("Sala creada:", res);

          // Lista inicial de jugadores
          updatePlayersList(
            [{ socketId: socket.id, username }],
            socket.id, // hostId
            socket.id // mySocketId
          );
        });
      });

      // Unirse a sala
      document.getElementById("joinRoomBtn").addEventListener("click", () => {
        const pin = Number(prompt("Ingresa el PIN de la sala:"));
        if (!pin) return;

        const username = prompt("Ahora ingresa tu nombre:");
        if (!username) return;

        socket.emit("joinRoom", { gamePin: pin, username }, (res) => {
          if (!res.success) {
            alert(`❌ Error: ${res.message}`);
            return;
          }
          console.log(`✅ Te uniste a la sala con PIN ${pin}`);
        });
      });

      // Broadcast a los demás: mostrar en consola solo a otros jugadores
      socket.on("playerJoined", (data) => {
        console.log(`👤 ${data.username} se unió a la sala`);
      });

      // Lista de jugadores actualizada
      socket.on("updatePlayers", (data) => {
        // data = { players: [...], hostId: 'socketIdHost' }
        updatePlayersList(data.players, data.hostId, socket.id);
      });
    </script>
  </body>
</html>
