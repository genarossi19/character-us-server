<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>CharacterUs Test</title>
  </head>
  <body>
    <h1>Prueba CharacterUs</h1>
    <button id="createRoomBtn">Crear Sala con Payload</button>

    <button id="createRoomBtn">Crear Sala</button>
    <button id="joinRoomBtn">Unirse a Sala</button>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
      const socket = io("http://localhost:3000");

      // Crear sala
      document.getElementById("createRoomBtn").addEventListener("click", () => {
        const username = prompt("Tu nombre de jugador:");
        socket.emit("createRoom", { username }, (res) => {
          console.log("Sala creada:", res); // { internalId, gamePin }
          alert(`Sala creada con PIN: ${res.gamePin}`);
        });
      });

      // Unirse a sala
      document.getElementById("joinRoomBtn").addEventListener("click", () => {
        const username = prompt("Tu nombre de jugador:");
        const gamePin = Number(prompt("Ingresa el PIN de la sala:"));

        socket.emit("joinRoom", { gamePin, username }, (res) => {
          console.log("Respuesta joinRoom:", res);
        });
      });

      // Broadcast
      socket.on("playerJoined", (data) => {
        console.log(`Jugador ${data.username} se unió a la sala`);
      });
    </script>
  </body>
</html>
